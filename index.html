<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة خدمات وأسعار المستشفى</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007bf5;
            --danger: #dc3545;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 20px;
        }

        header {
            background: linear-gradient(135deg, #0056b3, #007bf5);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .search-container {
            padding: 15px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 100;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 123, 245, 0.2);
        }

        .nav-tabs {
            display: flex;
            overflow-x: auto;
            padding: 0 15px 10px 15px;
            gap: 10px;
            scrollbar-width: none;
        }

        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .container {
            padding: 10px 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-info {
            flex-grow: 1;
        }

        .card-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .card-note {
            font-size: 0.8rem;
            color: #777;
        }

        .card-price {
            font-size: 1rem;
            font-weight: 700;
            color: var(--danger);
            background: #fff0f1;
            padding: 6px 12px;
            border-radius: 8px;
            white-space: nowrap;
            margin-right: 10px;
        }

        .card-price.inquire {
            color: #0056b3;
            background: #e6f2ff;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
        }

        .cta-btn {
            display: block;
            width: calc(100% - 30px);
            margin: 20px 15px;
            padding: 14px;
            background: #28a745;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3);
        }
    </style>
</head>
<body>

<header>
    <h1>قسم الخدمات والأسعار الطبية</h1>
    <p>دليل خدمات الطوارئ والعيادات والفحوصات</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن خدمة، كشف، أو تحليل..." onkeyup="filterServices()">
</div>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchCategory('all', event)">الكل</button>
    <button class="tab-btn" onclick="switchCategory('emergency', event)">🚨 خدمات الطوارئ</button>
    <button class="tab-btn" onclick="switchCategory('clinics', event)">👨‍⚕️ العيادات الخارجية</button>
    <button class="tab-btn" onclick="switchCategory('labs', event)">🔬 التحاليل الطبية</button>
    <button class="tab-btn" onclick="switchCategory('scans', event)">📡 العروض والفحوصات</button>
    <button class="tab-btn" onclick="switchCategory('pharmacy', event)">💊 المستهلكات والأدوية</button>
</div>

<div class="container">
    <div id="servicesContainer" class="grid">
        <!-- تحميل البيانات ديناميكياً -->
    </div>
</div>

<a href="tel:123456789" class="cta-btn">📞 تواصل معنا للاستفسار وحجز الخدمات</a>

    const servicesData = [

        { category: 'emergency', name: 'تركيب كانيولا', price: '10 ج.م', note: 'بدون المستهلكات', isFixed: true },
        { category: 'emergency', name: 'اختبار حساسية', price: '20 ج.م', note: 'بدون المستهلكات', isFixed: true },
        { category: 'emergency', name: 'رسم قلب', price: '100 ج.م', note: 'شامل المستهلكات', isFixed: true },

        { category: 'emergency', name: 'متابعة محلول الحديد بالساعة', price: '100 ج.م', note: 'بدون المستهلكات', isFixed: true },
        { category: 'emergency', name: 'عمل الجبيرة بالكشف', price: '150 ج.م', note: 'بدون المستهلكات', isFixed: true },
        { category: 'emergency', name: 'جلسة غسيل كلوي', price: '1700 ج.م', note: 'بدون أدوية', isFixed: true },
        { category: 'emergency', name: 'خروج طبيب مع الإسعاف', price: 'حسب الاتفاق مع الحسابات', note: 'بدون المستهلكات', isFixed: true },
        { category: 'emergency', name: 'غرز تجميل بالعمليات', price: 'حسب الاتفاق مع الحسابات', note: 'بدون المستهلكات', isFixed: true },

        // 👨‍⚕️ العيادات الخارجية (حسب سعر الفترة الزمنية)

        { category: 'clinics', name: 'كشف القلب', price: 'تواصل لمعرفة السعر حسب الفترة الزمنية', note: '', isFixed: false },

        // 🔬 التحاليل الطبية (حسب سعر اليوم)

        { category: 'scans', name: 'فحوصات الدوبلكس والشرايين', price: 'تواصل لمعرفة سعر العرض اليوم', note: 'قسم الأشعة', isFixed: false },

        // 💊 المستهلكات والأدوية (حسب سعر الأدوية اليوم)

        { category: 'pharmacy', name: 'الأدوية والمحاليل الطبية', price: 'تواصل لمعرفة سعر اليوم', note: 'الصيدلية / الطوارئ', isFixed: false }

    let currentCategory = 'all';

    function renderServices(data) {
        const container = document.getElementById('servicesContainer');
        container.innerHTML = '';
        
        if (data.length === 0) {
            container.innerHTML = '<p style="text-align:center; width:100%; padding:20px;">لا توجد نتائج مطابقة للبحث</p>';
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-info">
                    <div class="card-title">${item.name}</div>
                    <div class="card-note">${item.note || ''}</div>
                </div>
                <div class="card-price ${item.isFixed ? '' : 'inquire'}">${item.price}</div>
            `;
            container.appendChild(card);
        });
    }

    function filterServices() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = servicesData.filter(item => {
            const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
            const matchesQuery = item.name.toLowerCase().includes(query) || item.note.toLowerCase().includes(query);
            return matchesCategory && matchesQuery;
        });
        renderServices(filtered);
    }

    function switchCategory(cat, event) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) {
            event.target.classList.add('active');
        }
        filterServices();
    }

    // Load initial data
    renderServices(servicesData);
</script>
